<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <title>⚡ JARVIS</title>
  
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    /* ============================================================
       ESTILOS GLOBALES
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0a0f1e;
      font-family: 'Rajdhani', sans-serif;
      width: 100vw;
      height: 100vh;
    }

    /* ============================================================
       ESFERA 3D
       ============================================================ */
    #sphere {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      display: block;
      opacity: 1;
      background: transparent;
    }

    /* ============================================================
       ESTADO LABEL
       ============================================================ */
    #status-label {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      font-family: 'Orbitron', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #00e5ff;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 20px;
      border-radius: 20px;
      border: 1px solid rgba(0, 229, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      user-select: none;
      pointer-events: none;
    }

    /* ============================================================
       CHAT - BOTTOM BAR
       ============================================================ */
    #bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.3) 70%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 100;
    }

    #chat-input {
      flex: 1;
      height: 46px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(0, 229, 255, 0.15);
      border-radius: 23px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      font-family: 'Rajdhani', sans-serif;
    }

    #chat-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    #chat-input:focus {
      border-color: #00e5ff;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.1);
    }

    #send-btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      background: #00e5ff;
      color: #0a0f1e;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    #send-btn:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }

    #mic-btn {
      flex-shrink: 0;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(0, 229, 255, 0.15);
      background: rgba(255, 255, 255, 0.04);
      color: #00e5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #mic-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    #mic-btn.listening {
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.6);
      border-color: #00e5ff;
      animation: pulseGlow 1.5s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
      }
      50% {
        box-shadow: 0 0 60px rgba(0, 229, 255, 0.8);
      }
    }

    #drive-toggle-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #c9d1e0;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.7rem;
      transition: all 0.2s;
    }

    #drive-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    /* ============================================================
       RESPONSE CONTAINER - Glassmorphism LEGIBLE
       ============================================================ */
    #response-container {
      position: fixed;
      top: 70px;
      right: 20px;
      width: 420px;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      background: rgba(10, 15, 30, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 229, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      z-index: 50;
      display: none;
      padding: 16px 18px;
    }

    #response-container.show {
      display: block;
    }

    #response-container .response-item {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }

    .response-icon {
      font-size: 1.2rem;
      margin-right: 8px;
      display: inline-block;
    }

    .response-name {
      font-weight: 600;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #00e5ff;
    }

    .response-time {
      font-size: 0.5rem;
      color: rgba(255, 255, 255, 0.3);
      float: right;
    }

    .response-text {
      color: #e8edf5;
      font-size: 0.85rem;
      line-height: 1.6;
      margin-top: 4px;
    }

    .response-text strong {
      color: #ffffff;
    }

    .response-text em {
      color: #00e5ff;
      font-style: italic;
    }

    .response-text code {
      background: rgba(0, 0, 0, 0.4);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.75rem;
      color: #7efff5;
    }

    .response-text pre {
      background: rgba(0, 0, 0, 0.4);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.7rem;
      color: #c8d4e0;
      border-left: 3px solid #00e5ff;
    }

    /* ============================================================
       BOTÓN CENTRO DE COMANDO
       ============================================================ */
    .btn-command-center {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      font-family: 'Orbitron', monospace;
      background: rgba(0, 229, 255, 0.06);
      border: 1px solid rgba(0, 229, 255, 0.15);
      color: #00e5ff;
      padding: 10px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .btn-command-center:hover {
      background: rgba(0, 229, 255, 0.12);
      border-color: #00e5ff;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.15);
      transform: translateX(-50%) scale(1.02);
    }

    /* ============================================================
       SCROLLBAR
       ============================================================ */
    ::-webkit-scrollbar {
      width: 3px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 229, 255, 0.3);
      border-radius: 2px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 229, 255, 0.6);
    }

    /* ============================================================
       DECORACIONES DE ESQUINA
       ============================================================ */
    .corner-decoration {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(0, 229, 255, 0.05);
      z-index: 100;
      pointer-events: none;
    }

    .corner-decoration.tl {
      top: 15px;
      left: 15px;
      border-right: none;
      border-bottom: none;
    }

    .corner-decoration.tr {
      top: 15px;
      right: 15px;
      border-left: none;
      border-bottom: none;
    }

    .corner-decoration.bl {
      bottom: 15px;
      left: 15px;
      border-right: none;
      border-top: none;
    }

    .corner-decoration.br {
      bottom: 15px;
      right: 15px;
      border-left: none;
      border-top: none;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 768px) {
      #response-container {
        width: calc(100% - 32px);
        right: 16px;
        top: 60px;
        max-height: calc(100vh - 160px);
        padding: 12px 14px;
      }

      #status-label {
        font-size: 0.5rem;
        padding: 4px 14px;
        top: 12px;
      }

      #chat-input {
        height: 40px;
      }

      #mic-btn {
        width: 40px;
        height: 40px;
      }

      .corner-decoration {
        display: none;
      }

      .btn-command-center {
        bottom: 70px;
        padding: 8px 16px;
        font-size: 0.5rem;
      }
    }

    @media (max-width: 480px) {
      #sphere {
        width: 85vw;
        height: 85vw;
      }
    }
  </style>
</head>
<body>

  <!-- ===== DECORACIONES ===== -->
  <div class="corner-decoration tl"></div>
  <div class="corner-decoration tr"></div>
  <div class="corner-decoration bl"></div>
  <div class="corner-decoration br"></div>

  <!-- ===== ESTADO ===== -->
  <div id="status-label">INICIALIZANDO</div>

  <!-- ===== ESFERA 3D ===== -->
  <canvas id="sphere"></canvas>

  <!-- ===== BOTÓN CENTRO DE COMANDO ===== -->
  <button class="btn-command-center" onclick="window.open('/command-center.html','_blank')">
    <i class="fas fa-microchip"></i> CENTRO DE COMANDO
  </button>

  <!-- ===== CHAT ===== -->
  <div id="bottom-bar">
    <input id="chat-input" type="text" placeholder="💬 Escribí un comando..." autocomplete="off">
    <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
    <button id="mic-btn"><i class="fas fa-microphone"></i></button>
    <button id="drive-toggle-btn"><i class="fas fa-cloud-upload-alt"></i></button>
  </div>

  <!-- ===== RESPONSE CONTAINER ===== -->
  <div id="response-container"></div>

    <!-- ===== DRIVE CONVERTER ===== -->
  <div id="drive-converter-section" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,15,30,0.95);border:1px solid rgba(0,229,255,0.2);border-radius:12px;padding:20px;width:min(90%,450px);z-index:9998;max-height:90vh;overflow-y:auto;">
    <h2 style="color:#00e5ff;font-size:1rem;margin-bottom:8px;">
      <i class="fas fa-cloud-upload-alt"></i> Crear Publicación
    </h2>
    <p style="color:#8892a8;font-size:0.8rem;margin-bottom:12px;">Pega la URL de un video/imagen de Google Drive y completa los datos.</p>

    <!-- Campo: URL de Drive -->
    <div style="margin-bottom:10px;">
      <label style="color:#8892a8;font-size:0.75rem;display:block;margin-bottom:4px;">🔗 URL de Google Drive</label>
      <input id="drive-url" type="text" placeholder="https://drive.google.com/file/d/.../view" style="width:100%;padding:10px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;font-size:0.8rem;font-family:monospace;">
    </div>

    <!-- Campo: Título (Ahora parte del formulario) -->
    <div style="margin-bottom:10px;">
      <label style="color:#8892a8;font-size:0.75rem;display:block;margin-bottom:4px;">📝 Título</label>
      <input id="post-titulo" type="text" placeholder="Ej: La historia de Ragnar Lothbrok" style="width:100%;padding:10px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;font-size:0.8rem;">
    </div>

    <!-- Campo: Fecha de Publicación -->
    <div style="margin-bottom:10px;">
      <label style="color:#8892a8;font-size:0.75rem;display:block;margin-bottom:4px;">📅 Fecha de Publicación</label>
      <input id="post-fecha" type="datetime-local" style="width:100%;padding:10px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;font-size:0.8rem;">
    </div>

    <!-- Campo: Hashtags -->
    <div style="margin-bottom:10px;">
      <label style="color:#8892a8;font-size:0.75rem;display:block;margin-bottom:4px;">🏷️ Hashtags (separados por comas)</label>
      <input id="post-hashtags" type="text" placeholder="#vikingos, #historia, #reinoDeValhalla" style="width:100%;padding:10px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;font-size:0.8rem;">
    </div>

    <!-- Campo: Descripción -->
    <div style="margin-bottom:10px;">
      <label style="color:#8892a8;font-size:0.75rem;display:block;margin-bottom:4px;">📝 Descripción</label>
      <textarea id="post-descripcion" rows="2" placeholder="Descripción del video..." style="width:100%;padding:10px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;font-size:0.8rem;font-family:inherit;"></textarea>
    </div>

    <!-- Campo: Llamada a la Acción -->
    <div style="margin-bottom:10px;">
      <label style="color:#8892a8;font-size:0.75rem;display:block;margin-bottom:4px;">⚔️ Llamada a la Acción (CTA)</label>
      <input id="post-cta" type="text" placeholder="⚔️ ¡Síguenos para más historias!" style="width:100%;padding:10px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;font-size:0.8rem;">
    </div>

    <!-- Campo: URL de Portada -->
    <div style="margin-bottom:10px;">
      <label style="color:#8892a8;font-size:0.75rem;display:block;margin-bottom:4px;">🖼️ URL de Portada (opcional)</label>
      <input id="post-cover" type="text" placeholder="https://.../portada.jpg" style="width:100%;padding:10px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;font-size:0.8rem;">
    </div>

    <!-- SECCIÓN DE RESPUESTAS PERSONALIZADAS (Dinámica) -->
    <div style="margin-bottom:10px;border-top:1px solid rgba(255,255,255,0.1);padding-top:10px;">
      <label style="color:#8892a8;font-size:0.75rem;display:block;margin-bottom:4px;">🗣️ Respuestas Personalizadas</label>
      <div id="respuestas-container">
        <!-- Los campos se añadirán dinámicamente aquí -->
      </div>
      <button id="add-respuesta-btn" style="width:100%;padding:8px;background:rgba(0,229,255,0.1);border:1px dashed rgba(0,229,255,0.3);border-radius:6px;color:#00e5ff;cursor:pointer;font-size:0.75rem;margin-top:6px;">
        <i class="fas fa-plus-circle"></i> Añadir Palabra Clave
      </button>
    </div>

    <!-- Botón Convertir y Crear -->
    <button id="convert-drive-btn" style="width:100%;padding:12px;background:#00e5ff;color:#0a0f1e;border:none;border-radius:6px;cursor:pointer;font-weight:700;transition:all 0.2s;font-size:0.85rem;margin-top:8px;">
      <i class="fas fa-sync-alt"></i> Convertir y Crear Publicación
    </button>

    <!-- Botón Cerrar -->
    <button id="close-drive-section" style="width:100%;margin-top:8px;border:1px solid rgba(255,60,60,0.3);color:#ff6b6b;padding:10px;background:transparent;border-radius:6px;cursor:pointer;transition:all 0.2s;">
      <i class="fas fa-times"></i> Cerrar
    </button>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <script src="http://localhost:5000/socket.io/socket.io.js"></script>
  <script src="js/app-simple.js"></script>
  
</body>
</html>
